openapi: 3.1.0
info:
  title: ruby-veterinary Clinic Content API
  description: Public clinic profile — hours, contact, services, staff, downloadable documents.
  version: 1.0.0
servers:
  - url: https://api.ruby-veterinary.example.com/api/v1
  - url: http://localhost:3000/api/v1
tags:
  - name: Clinic
paths:
  /clinic/hours:
    get:
      tags: [Clinic]
      summary: Standard and holiday hours plus open-now state
      operationId: getClinicHours
      security: []
      responses:
        '200':
          description: Hours
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /clinic/contact:
    get:
      tags: [Clinic]
      summary: Phone, address, emergency numbers
      operationId: getClinicContact
      security: []
      responses:
        '200':
          description: Contact block
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /services:
    get:
      tags: [Clinic]
      summary: Service catalog with baseline pricing
      operationId: listServices
      security: []
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/CursorParam' }
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Published services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
  /services/{slug}:
    get:
      tags: [Clinic]
      summary: Single service page
      operationId: getService
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Service
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          $ref: '#/components/responses/NotFound'
  /staff:
    get:
      tags: [Clinic]
      summary: Published staff profiles
      operationId: listStaff
      security: []
      parameters:
        - { $ref: '#/components/parameters/LimitParam' }
        - { $ref: '#/components/parameters/CursorParam' }
      responses:
        '200':
          description: Staff grid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
  /documents:
    get:
      tags: [Clinic]
      summary: Downloadable care documents index
      operationId: listDocuments
      security: []
      responses:
        '200':
          description: Published documents
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionResponse' }
  /documents/{id}:
    get:
      tags: [Clinic]
      summary: Signed download link for a care document
      operationId: getDocumentDownload
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, example: doc_01H... }
      responses:
        '200':
          description: Signed URL payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      downloadUrl: { type: string, format: uri }
                      expiresAt: { type: string, format: date-time }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    CursorParam:
      name: cursor
      in: query
      required: false
      schema: { type: string }
  schemas:
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    PaginationMeta:
      type: object
      properties:
        limit: { type: integer }
        cursor: { type: string, nullable: true }
        hasMore: { type: boolean }
    ApiResponse:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: '#/components/schemas/Meta' }
    CollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: {} }
        meta:
          allOf:
            - $ref: '#/components/schemas/Meta'
            - type: object
              properties:
                pagination: { $ref: '#/components/schemas/PaginationMeta' }
    ErrorBody:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
  responses:
    NotFound:
      description: RESOURCE_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
